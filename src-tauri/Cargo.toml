[package]
name = "envarsa"
version = "1.2.0"
description = "Envarsa — a local-first library for your environment values."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# No default backend: Linux turns on the portal one below, and Windows
# needs none.
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
age = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# The update check (update.rs) — one GET to api.github.com. native-tls
# means the platform's own TLS stack does the handshake — schannel on
# Windows, the system's OpenSSL on Linux — no new TLS code in the
# binary (and nothing pulls aws-lc-sys, which does not build on
# windows-gnu).
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Already in the tree via tauri-utils — the same Version type as
# tauri::PackageInfo.version, so fetched-vs-running compares typed.
semver = "1"

# Windows APIs for title-bar branding and Store package detection.
# Tauri's HWND is rewrapped at the boundary if its bindings version differs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_Packaging_Appx"] }
# Used directly (not via the clipboard plugin) so copies can be marked
# excluded from the Windows clipboard history / cloud clipboard.
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# File dialogs through the desktop portal, which is the only way a
# Flatpak sees the user's files, and works outside one too. (Cargo
# unifies this feature with the main entry above.)
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
# The Documents portal maps a picked file back to its real path; the
# same version and features the dialog plugin already brings in.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
# GTK's own clipboard (clipboard.rs); already in the tree via Tauri.
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# tauri::test's mock app lets the command tests call the real commands.
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

# RUSTSEC-2024-0429: retain GTK 0.18 compatibility with the out-pointer fix.
# Provenance, validation, and removal instructions: vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
