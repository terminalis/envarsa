id: io.github.terminalis.Envarsa
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: envarsa
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: envarsa
    buildsystem: simple
    build-options:
      env:
        # cargo-sources.json unpacks the crates and a config that points
        # cargo at them under cargo/ in this module's build folder.
        CARGO_HOME: /run/build/envarsa/cargo
    build-commands:
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - cargo --offline build --release --locked --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/envarsa /app/bin/envarsa
      - install -Dm644 flatpak/io.github.terminalis.Envarsa.desktop /app/share/applications/io.github.terminalis.Envarsa.desktop
      - install -Dm644 flatpak/io.github.terminalis.Envarsa.metainfo.xml /app/share/metainfo/io.github.terminalis.Envarsa.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.terminalis.Envarsa.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.terminalis.Envarsa.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.terminalis.Envarsa.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.terminalis.Envarsa.png
    sources:
      # This checkout.
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - builddir
          - repo
          - node_modules
          - src-tauri/target
      # Generated by tools/flatpak-cargo-sources.sh from src-tauri/Cargo.lock.
      - cargo-sources.json
