# Builds the Windows and Linux artifacts and publishes them to a GitHub
# Release.
#
# Triggers on version tags (v0.1.0, v1.2.3, ...): push the tag and the release
# appears with the NSIS installer, portable zip, AppImage, and .deb attached.
# A manual run (workflow_dispatch) builds the same artifacts and attaches them
# to the run for inspection without creating a release.
#
# The Windows build mirrors the local setup from the README's windows-gnu
# note: gnu host toolchain, stock MinGW-w64 binutils on PATH, and the prefixed
# gcc aliases disabled so rustc keeps its self-contained linker. The gnu exe
# loads WebView2Loader.dll at runtime; tauri.windows.conf.json bundles it as a
# resource, and the setup-windows-gnu action (shared with ci.yml) stages it
# where the resource path expects — nothing else creates that file on a clean
# checkout.
#
# The Linux build runs on ubuntu-22.04 deliberately: the AppImage inherits the
# build host's glibc floor, so the older image keeps it runnable on Ubuntu
# 22.04+, Debian 12+, and peers. Tauri's bundler pulls WebKitGTK and OpenSSL
# into the AppImage; the .deb declares them as dependencies instead.
#
# When GitHub retires this runner image the floor moves with it: either pin the
# Linux build to a 22.04 container to hold the floor, or accept the newer glibc
# (which drops the older-distro support promised above and in the README).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # src-tauri/Cargo.toml is the one place the app version lives; Tauri reads it
  # when tauri.conf.json has no version of its own.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the app version from Cargo.toml
        id: read
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml |
            jq -r '.packages[] | select(.name == "envarsa") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fail if tag does not match the app version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version v$VERSION" >&2
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    needs: version
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-windows-gnu

      - name: Install tauri CLI
        run: npm ci

      - name: Run engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run build

      - name: Package portable zip
        run: npm run package:portable

      - name: Package MSIX for the Microsoft Store
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./tools/package-msix.ps1 -Version $env:VERSION

      - name: Attach artifacts to the run
        uses: actions/upload-artifact@v7
        with:
          name: envarsa-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/portable/*.zip

      # Unsigned MSIX for the Microsoft Store. Kept as a workflow artifact (not
      # a public release asset) — download it from this run's Artifacts and
      # upload to Partner Center, where the Store signs it on ingestion.
      - name: Attach MSIX to the run (for Microsoft Store upload)
        uses: actions/upload-artifact@v7
        with:
          name: envarsa-msix-x64
          path: out/Envarsa_*.msix

  build-linux:
    runs-on: ubuntu-22.04
    needs: version
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          # The Tauri v2 Linux prerequisites: WebKitGTK for the webview, the
          # toolchain for native deps, libssl-dev for native-tls (update.rs).
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev librsvg2-dev libssl-dev xdg-utils

      - name: Install tauri CLI
        run: npm ci

      - name: Run engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test GLib security backport with release optimizations
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --test glib_variant_str_iter

      - name: Build bundles
        run: npm run build

      - name: Attach artifacts to the run
        uses: actions/upload-artifact@v7
        with:
          name: envarsa-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  publish:
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-linux]
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nsis/*-setup.exe \
            dist/portable/*.zip \
            dist/appimage/*.AppImage \
            dist/deb/*.deb \
            --verify-tag --generate-notes --title "Envarsa $VERSION"
