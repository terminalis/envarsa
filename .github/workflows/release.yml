# Builds the Windows artifacts and publishes them to a GitHub Release.
#
# Triggers on version tags (v0.1.0, v1.2.3, ...): push the tag and the release
# appears with the NSIS installer and portable zip attached. A manual run
# (workflow_dispatch) builds the same artifacts and attaches them to the run
# for inspection without creating a release.
#
# The build mirrors the local setup from the README's windows-gnu note: gnu
# host toolchain (an MSVC build never produces target/release/WebView2Loader.dll,
# which tauri.conf.json bundles as a resource), stock MinGW-w64 binutils on
# PATH, and the prefixed gcc aliases disabled so rustc keeps its
# self-contained linker.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Fail if tag does not match the app version
        if: github.ref_type == 'tag'
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match tauri.conf.json version v$version"
          }

      - name: Set up windows-gnu toolchain
        run: |
          # MinGW binutils: rustc shells out to dlltool for raw-dylib crates,
          # and tauri-build's resource step needs windres/as plus an
          # unprefixed gcc for .rc preprocessing.
          if (-not (Test-Path 'C:\msys64\mingw64\bin\windres.exe')) {
            C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-toolchain
          }
          Add-Content $env:GITHUB_PATH 'C:\msys64\mingw64\bin'

          # A prefixed x86_64-w64-mingw32-gcc anywhere on PATH would be picked
          # up as the linker, and its CRT clashes with rustup's bundled MinGW
          # objects (see README windows-gnu note).
          $dirs = (($env:PATH -split ';') + 'C:\msys64\mingw64\bin') | Where-Object { $_ }
          foreach ($dir in $dirs) {
            foreach ($name in 'gcc', 'cc', 'g++', 'c++') {
              $alias = Join-Path $dir "x86_64-w64-mingw32-$name.exe"
              if (Test-Path $alias) { Rename-Item $alias "$alias.disabled" -Force }
            }
          }

          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Install tauri CLI
        run: npm ci

      - name: Run engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run build

      - name: Package portable zip
        run: npm run package:portable

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME `
            "src-tauri/target/release/bundle/nsis/Envarsa_${version}_x64-setup.exe" `
            "src-tauri/target/release/bundle/portable/envarsa_${version}_x64_portable.zip" `
            --verify-tag --generate-notes --title "Envarsa $version"

      - name: Attach artifacts to the run (manual builds)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: envarsa-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/portable/*.zip
