# Builds the release artifacts and publishes them to a GitHub Release: the
# portable Windows exe, the portable Linux AppImage and the Flatpak bundle.
# The MSIX for the Microsoft Store is built alongside and kept as a workflow
# artifact. The exe and the AppImage carry the version in their names
# (Envarsa_x.y.z_x64.exe, Envarsa_x.y.z_amd64.AppImage); either keeps its
# library in the Envarsa Data folder beside it, so a newer file saved into
# the same folder picks the library up.
#
# Triggers on version tags (v0.1.0, v1.2.3, ...): push the tag and the release
# appears with the exe, the AppImage and the bundle attached. A manual run
# (workflow_dispatch) builds the same artifacts and attaches them to the run
# for inspection without creating a release.
#
# `version` refuses a tag that doesn't match Cargo.toml, and any version
# without a <release> entry in the Flatpak metainfo: AppStream lists each
# release with its date, and software centers show them.
#
# The Windows build uses the runner's preinstalled MSVC Rust and Visual
# Studio, as ci.yml does. On MSVC the WebView2 loader is linked into the exe,
# so no DLL ships beside it.
#
# `build-linux` runs the engine tests, and the GLib backport test with release
# optimisations, on the same setup as ci.yml, then builds the AppImage. It runs
# on ubuntu-22.04 on purpose: the AppImage inherits the build host's glibc, so
# it runs on Ubuntu 22.04+, Debian 12+ and peers. When GitHub retires that
# image, move to the next one and accept the newer floor. `build-flatpak` is
# flatpak.yml, which builds the bundle in Flathub's CI image and lints it.
#
# After publishing, `publish` redeploys the website and starts
# publish.yml in terminalis/packages, which adds the new bundle to the signed
# Flatpak repository that Flatpak installs update from.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # src-tauri/Cargo.toml is the one place the app version lives; Tauri reads it
  # when tauri.conf.json has no version of its own.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the app version from Cargo.toml
        id: read
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml |
            jq -r '.packages[] | select(.name == "envarsa") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fail if tag does not match the app version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version v$VERSION" >&2
            exit 1
          fi

      - name: Fail if the Flatpak metainfo has no entry for this version
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if ! grep -qF "<release version=\"$VERSION\"" flatpak/io.github.terminalis.Envarsa.metainfo.xml; then
            echo "flatpak/io.github.terminalis.Envarsa.metainfo.xml has no <release version=\"$VERSION\"> entry" >&2
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    needs: version
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install tauri CLI
        run: npm ci

      - name: Run engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the exe
        run: npm run build

      - name: Name the exe after the version
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: Copy-Item src-tauri/target/release/envarsa.exe "Envarsa_${env:VERSION}_x64.exe"

      - name: Package MSIX for the Microsoft Store
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./tools/package-msix.ps1 -Version $env:VERSION

      - name: Attach artifacts to the run
        uses: actions/upload-artifact@v7
        with:
          name: envarsa-windows-x64
          path: Envarsa_*_x64.exe

      # Unsigned MSIX for the Microsoft Store. Kept as a workflow artifact (not
      # a public release asset) — download it from this run's Artifacts and
      # upload to Partner Center, where the Store signs it on ingestion.
      - name: Attach MSIX to the run (for Microsoft Store upload)
        uses: actions/upload-artifact@v7
        with:
          name: envarsa-msix-x64
          path: out/Envarsa_*.msix

  build-linux:
    runs-on: ubuntu-22.04
    needs: version
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          # The Tauri v2 Linux prerequisites: WebKitGTK for the webview, the
          # toolchain for native deps, libssl-dev for native-tls (update.rs).
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev librsvg2-dev libssl-dev xdg-utils

      - name: Install tauri CLI
        run: npm ci

      - name: Run engine tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test GLib security backport with release optimizations
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --test glib_variant_str_iter

      - name: Build the AppImage
        run: npm run build

      - name: Attach artifacts to the run
        uses: actions/upload-artifact@v7
        with:
          name: envarsa-linux-x64
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-flatpak:
    needs: version
    uses: ./.github/workflows/flatpak.yml

  publish:
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-linux, build-flatpak]
    # actions: write lets the website step start pages.yml.
    permissions:
      contents: write
      actions: write
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # An upload keeps only the folders after its path's first wildcard, so
      # the exe, the AppImage and the bundle all sit at the top of dist/.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*_x64.exe \
            dist/*_amd64.AppImage \
            dist/*_x86_64.flatpak \
            --verify-tag --generate-notes --title "Envarsa $VERSION"

      # The site's download buttons name the newest release's files. A
      # release created with GITHUB_TOKEN triggers no other workflow, but
      # workflow_dispatch is exempt, so start the site deploy directly.
      - name: Redeploy the website for the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      # The Flatpak repository (terminalis/packages) imports each release's
      # bundle. GITHUB_TOKEN can't start workflows in another repo, so this
      # uses a separate token.
      - name: Add the bundle to the Flatpak repository
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
        run: gh workflow run publish.yml --repo terminalis/packages --ref main
