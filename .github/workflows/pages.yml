# Deploys the static marketing site in website/ to GitHub Pages via Actions.
# This replaces the legacy "deploy from a branch (main / root)" source. After
# this lands on main, set Settings -> Pages -> Source to "GitHub Actions" for
# it to take over. The website/CNAME file keeps the envarsa.dev custom domain.
#
# The download buttons in index.html link to the newest release's files,
# whose names carry the version: the deploy replaces {{version}} with the
# latest release's version, and release.yml starts this workflow after each
# release so the links follow.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Point the download buttons at the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          sed -i "s/{{version}}/${tag#v}/g" website/index.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
