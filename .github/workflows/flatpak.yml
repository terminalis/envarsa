# Builds the Flatpak bundle and lints it the way Flathub does.
#
# Runs on pull requests that touch the packaging or the dependencies (the
# optimised Rust build is slow, so other pull requests skip it), and from
# release.yml, which attaches the bundle to the GitHub Release.
#
# The job runs in Flathub's CI image for the GNOME runtime the manifest uses;
# keep the two versions in step. The image comes with flatpak-builder, the
# linter (the same one org.flatpak.Builder runs) and the runtime installed.
# --privileged lets flatpak-builder set up its build sandbox.
#
# Screenshots are mirrored to dl.flathub.org/media, as on Flathub; the repo
# lint fails without it.
#
# cargo-sources.json is uploaded as well: the Flathub repository's copy must
# match the release tag's Cargo.lock (flatpak/README.md).

name: flatpak

on:
  pull_request:
    paths:
      - flatpak/**
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri*.json
      - tools/flatpak-cargo-sources.sh
      - .github/workflows/flatpak.yml
  workflow_call:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # The image has no cargo; the package version is the first top-level
      # `version` line.
      - name: Read the app version from Cargo.toml
        id: read
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Generate cargo-sources.json
        run: tools/flatpak-cargo-sources.sh

      - name: Lint the manifest
        run: flatpak-builder-lint manifest flatpak/dev.envarsa.Envarsa.yml

      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/dev.envarsa.Envarsa.yml
          bundle: Envarsa_${{ steps.read.outputs.version }}_x86_64.flatpak
          artifact-name: envarsa-flatpak-x86_64
          build-dir: builddir
          mirror-screenshots-url: https://dl.flathub.org/media
          cache-key: flatpak-builder-${{ hashFiles('flatpak/dev.envarsa.Envarsa.yml', 'src-tauri/Cargo.lock') }}

      - name: Lint the build
        run: flatpak-builder-lint repo repo

      - name: Attach cargo-sources.json to the run
        uses: actions/upload-artifact@v7
        with:
          name: cargo-sources
          path: flatpak/cargo-sources.json
