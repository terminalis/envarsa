# Checks every pull request before review: formatting, the Rust test suite,
# and the IPC contract between the webview and the Rust core.
#
# `check` runs on ubuntu-22.04 to match the Linux release build (see
# release.yml), with the README's Linux prerequisites. It uses the runner's
# preinstalled stable Rust, which includes rustfmt, the same as release.yml.
#
# `test-windows` runs the same test suite on the windows-gnu toolchain the
# release uses, so Windows-only code (#[cfg(windows)]: the clipboard history
# exclusion, the Store package check, the title bar) compiles and is tested on
# every pull request, not only when a release is built.

name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev librsvg2-dev libssl-dev

      - name: Check formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check IPC contract
        run: tools/check-contract.sh

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-windows-gnu

      - name: Run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
