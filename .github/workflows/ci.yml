# Checks every pull request before review: formatting, the Rust test suite,
# and the IPC contract between the webview and the Rust core.
#
# Runs on ubuntu-22.04 to match the Linux release build (see release.yml), with
# the README's Linux prerequisites. It uses the runner's preinstalled stable
# Rust, which includes rustfmt, the same as release.yml.
#
# Windows-only code (#[cfg(windows)]) doesn't compile here; a workflow_dispatch
# run of release.yml covers it.

name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev librsvg2-dev libssl-dev

      - name: Check formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check IPC contract
        run: tools/check-contract.sh
